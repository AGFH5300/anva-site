# Scheduled keep-alive disabled after migration to Render Static Site.
# Manual diagnostic remains available; static hosting does not sleep.
name: ANVA Website Keep-Alive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anva-keepalive.yml'

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping ANVA website
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.anva-group.com/'
          echo "Requesting $url"
          http_code=$(curl --location --silent --show-error --max-time 100 \
            --output /tmp/anva-response.html --write-out '%{http_code}' "$url")
          echo "HTTP status: $http_code"
          if (( http_code < 200 || http_code >= 400 )); then
            echo "ANVA website returned an unexpected response"
            exit 1
          fi
          if grep -Eiq 'SERVICE WAKING UP|INCOMING HTTP REQUEST DETECTED|WELCOME TO RENDER' /tmp/anva-response.html; then
            echo "Warning: the response contains Render startup text; the site may have been asleep."
          fi
