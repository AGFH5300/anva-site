# Adopt the two existing ANVA website services only in ANVA.MARINE RENDER ACCOUNT.
# Prepared after auditing service IDs:
#   Static: srv-dbmd8i3l550s739ghfbg
#   Legacy: srv-d7j5r4vavr4c7385ct60
# DO NOT use "create_new" when planning this Blueprint.
services:
  - type: web
    name: anva-site-static
    runtime: static
    repo: https://github.com/AGFH5300/anva-site
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npx vite build
    staticPublishPath: dist/public
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://images.unsplash.com;
          connect-src 'self' https://mxdibxggmfdfdgcrzbqy.supabase.co; object-src 'none'; base-uri 'self';
          frame-ancestors 'none'; form-action 'self' mailto:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      # These take precedence over the existing SPA fallback rewrite.
      # Render must return each page's correct prerendered HTML to crawlers.
      # Three standalone, crawlable product pages.
      - type: rewrite
        source: /products/bildal-airfield-lighting
        destination: /products/bildal-airfield-lighting/index.html
      - type: rewrite
        source: /products/bildal-airfield-lighting/
        destination: /products/bildal-airfield-lighting/index.html
      - type: rewrite
        source: /products/power-rectifiers-semiconductors
        destination: /products/power-rectifiers-semiconductors/index.html
      - type: rewrite
        source: /products/power-rectifiers-semiconductors/
        destination: /products/power-rectifiers-semiconductors/index.html
      - type: rewrite
        source: /products/welding-cables
        destination: /products/welding-cables/index.html
      - type: rewrite
        source: /products/welding-cables/
        destination: /products/welding-cables/index.html
      - type: rewrite
        source: /marine-capabilities
        destination: /marine-capabilities/index.html
      - type: rewrite
        source: /marine-capabilities/
        destination: /marine-capabilities/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /services
        destination: /services/index.html
      - type: rewrite
        source: /services/riding-squads
        destination: /services/riding-squads/index.html
      - type: rewrite
        source: /products-brands
        destination: /products-brands/index.html
      - type: rewrite
        source: /green-shipping-solutions
        destination: /green-shipping-solutions/index.html
      - type: rewrite
        source: /spares/engine-room-machinery
        destination: /spares/engine-room-machinery/index.html
      - type: rewrite
        source: /spares/hard-to-source-oem
        destination: /spares/hard-to-source-oem/index.html
      - type: redirect
        source: /products
        destination: /products-brands
      - type: redirect
        source: /brands
        destination: /products-brands
      - type: redirect
        source: /green-shipping
        destination: /green-shipping-solutions
      - type: redirect
        source: /anva.html
        destination: /about
      - type: redirect
        source: /contact.html
        destination: /contact
      - type: rewrite
        source: /*
        destination: /index.html

  # Legacy Node service is not the canonical website. Keep it recoverable
  # and correct its build path, but stop unnecessary auto-deploy attempts.
  - type: web
    name: anva-site
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/AGFH5300/anva-site
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build:legacy-server
    startCommand: npm start
